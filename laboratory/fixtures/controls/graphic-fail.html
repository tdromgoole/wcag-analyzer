<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Graphical arrow with insufficient contrast — Scanner laboratory</title><link rel="stylesheet" href="../../fixture.css"></head><body><nav aria-label="Laboratory"><a href="../../index.html">Return to laboratory</a></nav><main><h1>Graphical arrow with insufficient contrast</h1><p>The arrow is the only visual indication of the Expand trail details action. Its accessible name is deliberately present in both examples.</p><button id="case-target" type="button" aria-label="Expand trail details" aria-expanded="false" aria-controls="details" style="background:#fff;color:#172b46;border:2px solid #172b46;width:64px;height:64px"><svg aria-hidden="true" focusable="false" width="32" height="32" viewBox="0 0 32 32"><path id="arrow" fill="#cbd5e1" d="M4 10 L16 23 L28 10 Z"></path></svg></button><p id="details" hidden>Synthetic trail details.</p><script>document.querySelector('#case-target').onclick=event=>{const button=event.currentTarget,open=button.getAttribute('aria-expanded')==='true';button.setAttribute('aria-expanded',String(!open));document.querySelector('#details').hidden=open;};</script></main></body></html>
