<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dialog missing focus management — Scanner laboratory</title><link rel="stylesheet" href="../../fixture.css"></head><body><nav aria-label="Laboratory"><a href="../../index.html">Return to laboratory</a></nav><main><h1>Dialog missing focus management</h1><p>This isolated example intentionally leaves focus outside an opened modal. Close dialog or reload to reset.</p><button id="trigger" type="button">Open trail dialog</button><div id="case-target" role="dialog" aria-modal="true" aria-labelledby="dialog-title" hidden><h2 id="dialog-title">Trail details</h2><label for="first-field">Trail name</label><input id="first-field"><button id="close" type="button">Close dialog</button></div></main><script>const dialog=document.getElementById('case-target');document.getElementById('trigger').addEventListener('click',()=>{dialog.hidden=false;});document.getElementById('close').addEventListener('click',()=>{dialog.hidden=true;document.getElementById('trigger').focus();});document.addEventListener('keydown',event=>{if(event.key==='Escape'){dialog.hidden=true;document.getElementById('trigger').focus();}});</script></body></html>
