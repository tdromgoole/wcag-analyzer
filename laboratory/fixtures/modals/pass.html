<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Managed dialog focus — Scanner laboratory</title><link rel="stylesheet" href="../../fixture.css"></head><body><nav aria-label="Laboratory"><a href="../../index.html">Return to laboratory</a></nav><main><h1>Managed dialog focus</h1><button id="trigger" type="button">Open trail dialog</button><dialog id="case-target" aria-labelledby="dialog-title"><h2 id="dialog-title">Trail details</h2><label for="first-field">Trail name</label><input id="first-field" autofocus><button id="close" type="button">Close dialog</button></dialog></main><script>const dialog=document.getElementById('case-target');const trigger=document.getElementById('trigger');trigger.addEventListener('click',()=>dialog.showModal());document.getElementById('close').addEventListener('click',()=>dialog.close());dialog.addEventListener('close',()=>trigger.focus());</script></body></html>
