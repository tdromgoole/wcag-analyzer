<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pointer-only action — Scanner laboratory</title><link rel="stylesheet" href="../../fixture.css"></head><body><nav aria-label="Laboratory"><a href="../../index.html">Return to laboratory</a></nav><main><h1>Pointer-only action</h1><p>The action below intentionally lacks keyboard semantics and handlers. No keyboard trap is introduced.</p><div id="case-target" style="padding:12px;border:2px solid #172b46;cursor:pointer">Choose trail</div><p id="outcome">No trail selected.</p></main><script>document.getElementById('case-target').addEventListener('click',()=>{document.getElementById('outcome').textContent='Trail selected.';});</script></body></html>
